$kind: http-request
url: "{{base_url}}/api/v1/sections/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Sections list returns 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Has results array', function () {
          var json = pm.response.json();
          pm.expect(json.results).to.be.an('array');
      });

      pm.test('Status is ok', function () {
          var json = pm.response.json();
          pm.expect(json.status).to.equal('ok');
      });

      var json = pm.response.json();
      if (json.results.length > 0) {
          pm.collectionVariables.set('section_slug', json.results[0].slug);
      }
    language: text/javascript
order: 1000
