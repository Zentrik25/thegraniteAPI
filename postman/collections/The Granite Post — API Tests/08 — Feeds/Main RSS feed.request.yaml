$kind: http-request
url: "{{base_url}}/rss/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('RSS feed returns 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Content type is XML', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('xml');
      });
    language: text/javascript
order: 1000
