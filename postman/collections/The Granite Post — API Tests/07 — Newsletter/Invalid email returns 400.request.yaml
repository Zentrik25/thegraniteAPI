$kind: http-request
url: "{{base_url}}/api/v1/newsletter/subscribe/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "not-an-email"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Invalid email returns 400', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 3000
