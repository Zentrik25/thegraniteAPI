$kind: http-request
url: "{{base_url}}/api/v1/search/?q=zimbabwe"
method: GET
queryParams:
  q: zimbabwe
scripts:
  - type: afterResponse
    code: |-
      pm.test('Search returns 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Has results array', function () {
          var json = pm.response.json();
          pm.expect(json.results).to.be.an('array');
      });

      pm.test('Has count', function () {
          var json = pm.response.json();
          pm.expect(json.count).to.be.a('number');
      });

      pm.test('Query echoed in response', function () {
          var json = pm.response.json();
          pm.expect(json.query).to.equal('zimbabwe');
      });
    language: text/javascript
order: 1000
