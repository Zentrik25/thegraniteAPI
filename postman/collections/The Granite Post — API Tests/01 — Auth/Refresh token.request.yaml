$kind: http-request
url: "{{base_url}}/api/v1/auth/token/refresh/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "refresh": "{{refresh_token}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Refresh returns 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('New access token returned', function () {
          var json = pm.response.json();
          pm.expect(json.access).to.be.a('string');
      });
    language: text/javascript
order: 5000
