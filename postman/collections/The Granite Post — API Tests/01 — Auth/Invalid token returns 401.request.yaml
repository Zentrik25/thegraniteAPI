$kind: http-request
url: "{{base_url}}/api/v1/auth/me/"
method: GET
headers:
  Authorization: Bearer invalidtoken123
scripts:
  - type: afterResponse
    code: |-
      pm.test('Invalid token returns 401', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 4000
