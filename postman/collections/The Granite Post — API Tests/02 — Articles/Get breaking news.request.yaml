$kind: http-request
url: "{{base_url}}/api/v1/articles/breaking/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Breaking news returns 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Has results array', function () {
          var json = pm.response.json();
          pm.expect(json.results).to.be.an('array');
      });
    language: text/javascript
order: 6000
