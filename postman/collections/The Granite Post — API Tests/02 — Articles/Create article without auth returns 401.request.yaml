$kind: http-request
url: "{{base_url}}/api/v1/articles/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "title": "Should fail",
        "body": "No auth.",
        "status": "draft"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('No auth returns 401', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 8000
