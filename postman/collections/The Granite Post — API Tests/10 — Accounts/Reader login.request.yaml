$kind: http-request
url: "{{base_url}}/api/v1/accounts/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "postman_reader@test.com",
        "password": "TestPass123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Reader login returns 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Has access token', function () {
          var json = pm.response.json();
          pm.expect(json.access).to.be.a('string');
      });

      var json = pm.response.json();
      pm.collectionVariables.set('reader_access_token', json.access);
    language: text/javascript
order: 3000
