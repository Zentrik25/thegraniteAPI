$kind: http-request
url: "{{base_url}}/api/v1/accounts/register/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "postman_reader@test.com",
        "username": "postman_reader2",
        "password": "TestPass123!",
        "display_name": "Postman Reader 2"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Duplicate email returns 400', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 2000
