$kind: http-request
url: "{{base_url}}/api/v1/articles/{{article_slug}}/comments/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Comments list returns 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Pending comment not visible', function () {
          var json = pm.response.json();
          json.results.forEach(function(c) {
              pm.expect(c.author_name).to.not.equal('Postman Tester');
          });
      });
    language: text/javascript
order: 2000
