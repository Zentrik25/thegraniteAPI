$kind: http-request
url: "{{base_url}}/health/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Health check returns 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Status is ok', function () {
          var json = pm.response.json();
          pm.expect(json.status).to.equal('ok');
      });
    language: text/javascript
order: 1000
